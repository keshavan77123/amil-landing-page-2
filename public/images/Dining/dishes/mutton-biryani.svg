<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2D2825" />
      <stop offset="60%" stop-color="#1A1815" />
      <stop offset="100%" stop-color="#12100E" />
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#8F2424" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8F2424" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="180" fill="url(#glowGrad)" />

  <!-- Elegant Decorative Border -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#B08D57" stroke-opacity="0.3" stroke-width="1.5" rx="6" />
  <rect x="26" y="26" width="548" height="398" fill="none" stroke="#B08D57" stroke-opacity="0.15" stroke-width="1" rx="4" />

  <!-- Corner Flourishes -->
  <path d="M 32 44 L 44 32" stroke="#B08D57" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 568 44 L 556 32" stroke="#B08D57" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 32 406 L 44 418" stroke="#B08D57" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 568 406 L 556 418" stroke="#B08D57" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Hotel Brand Crest Subdued -->
  <circle cx="300" cy="180" r="70" fill="none" stroke="#B08D57" stroke-opacity="0.12" stroke-width="1" />
  <circle cx="300" cy="180" r="62" fill="none" stroke="#B08D57" stroke-opacity="0.08" stroke-dasharray="3,3" />

  <!-- Dish Icon -->
  <text x="300" y="195" font-size="64" text-anchor="middle" dominant-baseline="middle" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.6))">🥘</text>

  <!-- Category Badge -->
  <g transform="translate(300, 260)">
    <rect x="-65" y="-13" width="130" height="26" rx="4" fill="#B32B2B" fill-opacity="0.85" stroke="#B08D57" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="4" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#F6F1E9" letter-spacing="2" text-anchor="middle">BIRYANI</text>
  </g>

  <!-- Dish Name -->
  <text x="300" y="315" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="600" fill="#FBF8F3" text-anchor="middle" letter-spacing="0.5">
    Virudhunagar Mutton Biryani
  </text>

  <!-- Accent Divider -->
  <line x1="260" y1="335" x2="340" y2="335" stroke="#B08D57" stroke-opacity="0.5" stroke-width="1" />
  <polygon points="300,332 304,335 300,338 296,335" fill="#B08D57" fill-opacity="0.8" />

  <!-- Subtitle -->
  <text x="300" y="365" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#B08D57" text-anchor="middle" letter-spacing="1.5">
    SAFFRON RESTAURANT • HOTEL AMIL
  </text>
</svg>